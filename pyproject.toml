[project]
name = "karaoke-jp"
version = "1.0.0"
description = "Japanese karaoke video generator: pitch bars, per-mora lyric wipe and furigana from any song"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Lanternko" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "yt-dlp>=2025.1",
    "soundfile>=0.12",
    "numpy>=1.26,<3.0",
    "mido>=1.3",
]

[project.optional-dependencies]
# Per-stage extras. Install only what you need on a given machine,
# since some combinations conflict (e.g. RoFormer torch vs WhisperX torch).
separation = [
    "melband-roformer-infer>=0.1.1",
]
render = [
    "Pillow>=10.0",
    "ffmpeg-python>=0.2.0",
]
score = [
    "librosa>=0.10",
]
batch = [
    "snakemake>=8.0",
]
gui = [
    "gradio>=5,<6",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
]

[project.scripts]
karaoke-jp = "karaoke_jp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karaoke_jp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
